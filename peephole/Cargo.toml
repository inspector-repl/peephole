[package]
name = "peephole"
description = "Stop a running Rust program and inspect its variables from a REPL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
peephole-protocol.workspace = true
serde_json.workspace = true
bevy_reflect = { version = "0.20", default-features = false, features = ["std", "functions"] }
# Only the core, logic, string, list and math packages are loaded.
rhai = { version = "1", default-features = false, features = ["std", "only_i64", "no_time", "no_module", "no_custom_syntax"] }

[lints]
workspace = true
