[workspace]
resolver = "3"
members = ["protocol", "peephole", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/inspector-repl/peephole"

[workspace.dependencies]
peephole-protocol = { path = "protocol" }
serde_json = "1"
nix = { version = "0.31", default-features = false }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
